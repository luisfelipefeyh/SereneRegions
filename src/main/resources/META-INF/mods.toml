modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL = "https://github.com/luisfelipefeyh/SereneRegions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
logoFile = "image.png"
logoBlur = false
displayTest="IGNORE_SERVER_VERSION"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL = "https://github.com/luisfelipefeyh/SereneRegions"
credits = "Thanks Luisa for the artwork!"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId = "regions_unexplored"
    mandatory = true
    versionRange = "[0.5.6,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "sereneseasons"
    mandatory = true
    versionRange = "[9.1,)"
    ordering = "AFTER"
    side = "BOTH"